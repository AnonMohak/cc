<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#02030a" />
    <title>404 · Galaxy Sandbox</title>
    <!-- Cloudflare Pages serves this file for unknown paths. Vite copies it as is
         (no base rewrite), so links are absolute paths on me-momo.co.in. -->
    <style>
      :root {
        --mono: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: radial-gradient(ellipse at 50% 40%, #0b1030 0%, #02030a 65%);
        color: #dfe6ff;
        font-family: var(--mono);
        display: grid;
        place-items: center;
        padding: 16px;
      }
      .panel {
        width: min(400px, 100%);
        padding: 24px 24px 20px;
        background: rgba(12, 15, 32, 0.55);
        border: 1px solid rgba(160, 180, 255, 0.18);
        border-radius: 14px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45), inset 0 1px rgba(255, 255, 255, 0.06);
      }
      h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.22em; color: #eef2ff; }
      p { margin: 6px 0 18px; font-size: 12px; line-height: 1.5; color: rgba(200, 210, 255, 0.6); }
      nav { display: flex; gap: 16px; flex-wrap: wrap; border-top: 1px solid rgba(160, 180, 255, 0.14); padding-top: 12px; }
      a {
        font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
        color: #cfe0ff; text-decoration: none;
      }
      a.quiet { color: rgba(200, 210, 255, 0.5); }
      a:hover { color: #fff; }
      a:focus-visible { outline: 1px solid rgba(160, 180, 255, 0.5); outline-offset: 4px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <main class="panel">
      <h1>404 · LOST IN SPACE</h1>
      <p>Nothing orbits at this address. The page may have moved, or the link is wrong.</p>
      <nav>
        <a href="/three/galaxy-sandbox/">Back to the sandbox</a>
        <a class="quiet" href="/">momo home</a>
      </nav>
    </main>
  </body>
</html>
