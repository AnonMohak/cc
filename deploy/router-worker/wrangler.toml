# Router Worker for me-momo.co.in (deploy: npx wrangler deploy, from this folder).
#
# It owns the whole domain: attach me-momo.co.in and www.me-momo.co.in to this
# Worker as Custom Domains (dashboard: Settings -> Domains & Routes). Project
# paths go to their Pages projects (src/routes.js); every other request goes
# to the main site Worker through the SITE service binding below.
name = "me-momo-router"
main = "src/index.js"
compatibility_date = "2026-09-01"

[[services]]
binding = "SITE"
service = "my-site-temp"

# Visit counter (src/visits.js): one data point for each page load.
[[analytics_engine_datasets]]
binding = "VISITS"
dataset = "momo_visits"
