<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create, shape and explore procedural 3D galaxies." />
    <meta name="theme-color" content="#02030a" />
    <link rel="icon" type="image/png" href="/icon/icon-dark.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/icon/icon-light.png" media="(prefers-color-scheme: dark)" />
    <link rel="preload" href="/fonts/jetbrains-mono-latin-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/michroma-latin-400.woff2" as="font" type="font/woff2" crossorigin />
    <title>Galaxy Sandbox</title>
    <!-- Inline so the first paint is already dark and the start box is styled
         before the JavaScript (and style.css) arrives. -->
    <style>
      @font-face {
        font-family: 'JetBrains Mono';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/jetbrains-mono-latin-400.woff2') format('woff2');
      }
      @font-face {
        font-family: 'JetBrains Mono';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url('/fonts/jetbrains-mono-latin-600.woff2') format('woff2');
      }
      :root {
        --mono: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #02030a;
        color: #dfe6ff;
      }
      @font-face {
        font-family: 'Michroma';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/michroma-latin-400.woff2') format('woff2');
      }
      /* A film title card over the blurred scene: no box, wide spaced
         capitals, the prompt low on the screen. */
      .start {
        --title: 'Michroma', var(--mono);
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        place-items: center;
        padding: 16px;
        box-sizing: border-box;
        background: radial-gradient(ellipse at center, rgba(2, 3, 10, 0.25) 0%, rgba(2, 3, 10, 0.5) 55%, rgba(2, 3, 10, 0.85) 100%);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        font-family: var(--title);
        text-align: center;
        cursor: default;
        transition: opacity 0.3s ease;
      }
      @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
        .start {
          background: radial-gradient(ellipse at center, rgba(2, 3, 10, 0.7) 0%, rgba(2, 3, 10, 0.95) 100%);
        }
      }
      .start.is-ready {
        cursor: pointer;
      }
      .start.is-closing {
        opacity: 0;
      }
      .start-title {
        margin: 0;
        /* Letter spacing also follows the last letter: pad the left by the
           same amount so the word sits in the true centre. */
        padding-left: 0.38em;
        font-size: clamp(14px, 4.4vw, 46px);
        font-weight: 400;
        line-height: 1.2;
        letter-spacing: 0.38em;
        color: #eef2ff;
        text-shadow: 0 0 24px rgba(150, 175, 255, 0.35);
        animation: start-in 1.5s ease-out both;
      }
      .start-rule {
        width: 56px;
        height: 1px;
        margin: clamp(14px, 2.4vw, 22px) auto;
        border: 0;
        background: linear-gradient(90deg, transparent, rgba(190, 205, 255, 0.55), transparent);
        animation: start-in 1.5s ease-out 0.5s both;
      }
      .start-sub {
        max-width: 34em;
        margin: 0 auto;
        padding-left: 0.24em;
        font-size: clamp(9px, 1.5vw, 12px);
        line-height: 1.9;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: rgba(200, 212, 255, 0.62);
        animation: start-in 1.5s ease-out 0.9s both;
      }
      .start-go {
        position: absolute;
        left: 0;
        right: 0;
        bottom: calc(max(28px, 7vh) + env(safe-area-inset-bottom, 0px));
        display: grid;
        margin: 0;
        padding: 8px 16px 8px calc(16px + 0.32em);
        border: 0;
        background: none;
        font: 400 clamp(9px, 1.3vw, 11px)/1.4 var(--title);
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: #cfdcff;
        cursor: inherit;
      }
      .start-go:focus-visible {
        outline: none;
      }
      /* Both lines share one cell, so the swap does not move anything. */
      .start-go > span {
        grid-area: 1 / 1;
        transition: opacity 1.4s ease;
      }
      .start-go .go-loading {
        opacity: 0.38;
      }
      .start-go .go-ready {
        opacity: 0;
      }
      .is-ready .start-go .go-loading {
        opacity: 0;
        transition-duration: 0.4s;
      }
      .is-ready .start-go .go-ready {
        opacity: 1;
        transition-delay: 0.3s;
      }
      .start-go .go-tap {
        display: none;
      }
      @media (pointer: coarse) {
        .start-go .go-click {
          display: none;
        }
        .start-go .go-tap {
          display: inline;
        }
      }
      @keyframes start-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .start,
        .start-go > span {
          transition: none;
        }
        .start-title,
        .start-rule,
        .start-sub {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="start" id="start" role="dialog" aria-modal="true" aria-labelledby="start-title">
      <div class="start-panel">
        <h1 class="start-title" id="start-title">GALAXY SANDBOX</h1>
        <hr class="start-rule" />
        <p class="start-sub">Create, shape and explore procedural galaxies.</p>
      </div>
      <button class="start-go" type="button" disabled>
        <span class="go-loading">Loading...</span>
        <span class="go-ready"><span class="go-click">Click</span><span class="go-tap">Tap</span> anywhere to start</span>
      </button>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
